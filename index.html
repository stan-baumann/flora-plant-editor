<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flora-Pflanzen-Editor</title>
<style>
:root {
  --bg: #12151a; --panel: #1b1f26; --panel2: #232831; --line: #313846; --text: #e6e9ef;
  --muted: #98a2b3; --accent: #6cc4ff; --warn: #ffb454; --err: #ff6b6b; --ok: #7ddc8a;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
  font: 13px/1.4 system-ui, "Segoe UI", Roboto, sans-serif; }
button, select, input, textarea { font: inherit; color: var(--text); background: var(--panel2);
  border: 1px solid var(--line); border-radius: 6px; }
button { padding: 5px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.on { background: #24425a; border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
input[type=number] { width: 64px; padding: 4px 6px; }
input[type=text] { padding: 4px 6px; }
select { padding: 4px 6px; }
textarea { width: 100%; padding: 6px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; resize: vertical; }
label { color: var(--muted); }
header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--panel);
  border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0 10px 0 0; white-space: nowrap; }
header .sp { flex: 1; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 470px; height: calc(100% - 49px); }
#left { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); }
.bar { display: flex; gap: 6px; align-items: center; padding: 6px 10px; background: var(--panel);
  border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.bar .grp { display: flex; gap: 4px; align-items: center; padding-right: 8px; margin-right: 2px;
  border-right: 1px solid var(--line); }
.bar .grp:last-child { border-right: 0; }
#canvasWrap { position: relative; flex: 1; min-height: 240px; }
#editor { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
#hint { position: absolute; left: 12px; bottom: 10px; color: var(--muted); pointer-events: none; font-size: 12px; }
#bottom { padding: 6px 10px; background: var(--panel); border-top: 1px solid var(--line); }
#segPanel { display: none; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
#segPanel.show { display: flex; }
#right { overflow-y: auto; padding: 10px 12px 30px; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
section h2 { font-size: 13px; margin: 0 0 8px; color: var(--accent); font-weight: 600; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.row label { min-width: 0; }
#preview { width: 100%; image-rendering: pixelated; background: #000; border-radius: 4px; display: block; }
#melody { font-family: ui-monospace, Consolas, monospace; font-size: 12px; line-height: 1.7; word-break: break-word; }
#melody span { padding: 0 2px; border-radius: 3px; }
#melody span.rest { color: #5c6577; }
#melody span.bad { color: var(--err); }
#melody span.cur { background: var(--accent); color: #000; }
#status { font-size: 12px; margin: 6px 0; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); }
table { border-collapse: collapse; width: 100%; font-size: 12px; }
th, td { text-align: right; padding: 2px 6px; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
.legend { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 4px; border-radius: 2px; vertical-align: middle; }
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 10; }
#modal.show { display: flex; }
#modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; width: min(760px, 94vw); }
#modal textarea { height: 300px; }
#dlg { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 20; }
#dlg.show { display: flex; }
#dlg .box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; width: min(460px, 92vw); }
#dlg p { margin: 0 0 12px; }
.small { font-size: 12px; color: var(--muted); }
details summary { cursor: pointer; color: var(--muted); }
@media (max-width: 1000px) {
  main { grid-template-columns: 1fr; height: auto; }
  #left { height: 75vh; border-right: 0; }
}
</style>
</head>
<body>
<header>
  <h1>🌱 <span data-i18n="app.title">Flora-Pflanzen-Editor</span></h1>
  <button id="btnNew" data-i18n="btn.new" data-i18n-title="btn.new.t">Neu</button>
  <button id="btnOpen" data-i18n="btn.open" data-i18n-title="btn.open.t">Öffnen…</button>
  <input id="fileInput" type="file" accept=".flora,.lua,.txt" hidden>
  <select id="exampleSel" data-i18n-title="ex.choose"><option value="" data-i18n="ex.choose">Beispiel laden…</option></select>
  <button id="btnSave" data-i18n="btn.save" data-i18n-title="btn.save.t">Speichern (.flora)</button>
  <button id="btnUndo" data-i18n-title="btn.undo.t">↶</button>
  <button id="btnRedo" data-i18n-title="btn.redo.t">↷</button>
  <span class="sp"></span>
  <label for="langSel" title="Sprache / Language / Idioma / Langue">🌐</label>
  <select id="langSel" data-i18n-title="lang.t">
    <option value="de">Deutsch</option><option value="en">English</option>
    <option value="es">Español</option><option value="fr">Français</option>
  </select>
  <button id="btnHelp" data-i18n="btn.help">Hilfe</button>
</header>
<main>
  <div id="left">
    <div class="bar">
      <div class="grp" id="tools">
        <button data-tool="draw" class="on" data-i18n="tool.draw" data-i18n-title="tool.draw.t">✏️ Zeichnen</button>
        <button data-tool="select" data-i18n="tool.select" data-i18n-title="tool.select.t">↖ Auswählen</button>
        <button data-tool="paint" data-i18n="tool.paint" data-i18n-title="tool.paint.t">🖌 Übertragen</button>
        <button data-tool="erase" data-i18n="tool.erase" data-i18n-title="tool.erase.t">⌫ Radieren</button>
      </div>
      <div class="grp" id="types">
        <button data-type="F" class="on" data-i18n="type.F" data-i18n-title="type.F.t">♪ Ton</button>
        <button data-type="G" data-i18n="type.G" data-i18n-title="type.G.t">— Linie</button>
        <button data-type="f" data-i18n="type.f" data-i18n-title="type.f.t">┄ Sprung</button>
      </div>
      <div class="grp">
        <label for="curGen" data-i18n="lbl.gen">Generation</label>
        <input id="curGen" type="number" min="0" max="30" value="0">
      </div>
      <div class="grp">
        <label for="angleSel" data-i18n="lbl.angle">Winkel</label>
        <select id="angleSel"><option>30</option><option>45</option><option selected>60</option><option>90</option></select>
        <label for="symSel" data-i18n="lbl.sym">Symmetrie</label>
        <select id="symSel"></select>
        <label data-i18n-title="lbl.mirror.t"><input id="mirrorChk" type="checkbox"> <span data-i18n="lbl.mirror">Spiegeln</span></label>
        <label data-i18n-title="lbl.mirrorPitch.t"><input id="mirrorPitchChk" type="checkbox" checked> <span data-i18n="lbl.mirrorPitch">gleiche Töne</span></label>
      </div>
      <div class="grp">
        <label><input id="gridChk" type="checkbox" checked> <span data-i18n="lbl.grid">Raster</span></label>
        <label><input id="pitchChk" type="checkbox" checked> <span data-i18n="lbl.pitches">Tonhöhen</span></label>
        <button id="btnCenter" data-i18n-title="btn.center.t">⌖</button>
      </div>
    </div>
    <div id="canvasWrap">
      <canvas id="editor"></canvas>
      <div id="hint"></div>
    </div>
    <div id="bottom">
      <div class="row" style="margin:0">
        <label for="viewGen" data-i18n="lbl.viewGen">Ansicht bis Generation</label>
        <input id="viewGen" type="range" min="0" max="0" value="0" style="flex:1;min-width:120px">
        <span id="viewGenLbl">0</span>
        <span class="legend" id="legend"></span>
      </div>
      <div id="segPanel">
        <b data-i18n="seg.title">Linie:</b>
        <button data-st="F" data-i18n="type.F">♪ Ton</button><button data-st="G" data-i18n="type.G">— Linie</button><button data-st="f" data-i18n="type.f">┄ Sprung</button>
        <label><span data-i18n="lbl.gen">Generation</span> <input id="segGen" type="number" min="0" max="30"></label>
        <label data-i18n-title="seg.fixed.t"><input id="segPitchChk" type="checkbox"> <span data-i18n="seg.fixed">feste Tonhöhe</span></label>
        <input id="segPitch" type="number" min="1" max="24">
        <span id="segInfo" class="small"></span>
        <button id="segDel" data-i18n="seg.delete">Löschen</button>
      </div>
    </div>
  </div>

  <div id="right">
    <section>
      <h2 data-i18n="sec.preview">Vorschau (norns, 128 × 64)</h2>
      <canvas id="preview" width="640" height="320"></canvas>
      <div class="row" style="margin-top:6px">
        <button id="btnFit" data-i18n="btn.fit" data-i18n-title="btn.fit.t">Einpassen</button>
        <label><input id="plant2Chk" type="checkbox" checked> <span data-i18n="lbl.plant2">Pflanze 2 (gedimmt) zeigen</span></label>
      </div>
    </section>

    <section>
      <h2 data-i18n="sec.sound">Klang</h2>
      <div class="row">
        <button id="btnPlay" data-i18n="btn.play">▶ Abspielen</button>
        <button id="btnStop" data-i18n="btn.stop">■ Stopp</button>
        <label><input id="loopChk" type="checkbox"> <span data-i18n="lbl.loop">Schleife</span></label>
        <label><span data-i18n="lbl.noteMs">Notenlänge</span> <input id="noteMs" type="number" min="40" max="2000" step="10" value="250"> ms</label>
      </div>
      <div class="row">
        <label><span data-i18n="lbl.scale">Tonleiter</span> <select id="scaleSel"></select></label>
        <label><span data-i18n="lbl.root">Grundton</span> <input id="rootNote" type="number" min="0" max="127" value="45"></label>
        <label data-i18n-title="lbl.ns.t">Note scalar <input id="noteScalar" type="number" min="0" max="20" step="0.1" value="3"></label>
      </div>
      <div id="melody"></div>
      <p class="small" data-i18n="sound.note">Tonhöhen als Stufe 1–24 der Tonleiter, „·“ = Pause. Der Klang ist eine Annäherung an Floras Engine.</p>
    </section>

    <section>
      <h2>Code</h2>
      <div id="status"></div>
      <div class="row">
        <label><span data-i18n="lbl.name">Name</span> <input id="plantName" type="text" value="neue_pflanze" style="width:170px"></label>
      </div>
      <div class="row">
        <label><span data-i18n="lbl.angle">Winkel</span> <input id="cAngle" type="number" step="any"></label>
        <label><span data-i18n="lbl.length">Schrittlänge</span> <input id="cLength" type="number" step="0.1"></label>
        <label><span data-i18n="lbl.rot">Startrichtung</span> <input id="cRot" type="number" step="any"></label>
      </div>
      <div class="row">
        <label>Start x <input id="cX" type="number" step="0.5"></label>
        <label>Start y <input id="cY" type="number" step="0.5"></label>
        <label><span data-i18n="lbl.maxgen">Max. Gen.</span> <input id="cMax" type="number" min="1" max="30"></label>
        <label><span data-i18n="lbl.startgen">Startgen.</span> <input id="cStart" type="number" min="0" max="30"></label>
      </div>
      <label for="cAxiom" data-i18n="lbl.axiom">Axiom</label>
      <textarea id="cAxiom" rows="3" spellcheck="false"></textarea>
      <label for="cRules" data-i18n-html="lbl.rules">Regeln (eine pro Zeile: <code>A = …</code>)</label>
      <textarea id="cRules" rows="6" spellcheck="false"></textarea>
      <div class="row" style="margin-top:6px">
        <button id="btnToDrawing" data-i18n="btn.toDrawing" data-i18n-title="btn.toDrawing.t">Zeichnung aus Code aufbauen</button>
        <button id="btnRecompile" data-i18n="btn.recompile" data-i18n-title="btn.recompile.t">Code aus Zeichnung erzeugen</button>
      </div>
      <details style="margin-top:8px" open>
        <summary data-i18n="lbl.gens">Generationen</summary>
        <table id="genTable"></table>
      </details>
    </section>

    <section>
      <h2 data-i18n="sec.export">Export</h2>
      <div class="row">
        <button id="btnSave2" data-i18n="btn.save2">.flora speichern</button>
        <button id="btnMaiden" data-i18n="btn.maiden">maiden-Befehl</button>
        <button id="btnCatalog" data-i18n="btn.catalog">Katalog-Eintrag</button>
      </div>
      <p class="small" data-i18n-html="export.note"></p>
    </section>
  </div>
</main>

<div id="modal"><div class="box">
  <h2 id="modalTitle" style="margin:0 0 8px;font-size:14px"></h2>
  <div id="modalBody"></div>
  <div class="row" style="justify-content:flex-end;margin-top:8px">
    <button id="modalCopy" data-i18n="btn.copy">Kopieren</button>
    <button id="modalClose" data-i18n="btn.close">Schließen</button>
  </div>
</div></div>

<div id="dlg"><div class="box" role="dialog" aria-modal="true">
  <p id="dlgText"></p>
  <div class="row" style="justify-content:flex-end;margin:0">
    <button id="dlgCancel" data-i18n="btn.cancel">Abbrechen</button>
    <button id="dlgOk" class="on">OK</button>
  </div>
</div></div>

    'help': `<p><b>Zeichnen:</b> Mit ✏️ ziehst du vom roten Startpunkt oder von einem Knoten aus eine Linie. Sie rastet in die erlaubten Richtungen des Winkels ein und wird in Schritte zerlegt. <b>Symmetrie</b> vervielfacht alles um den Startpunkt, <b>Spiegeln</b> legt jede neue Linie gespiegelt an der senkrechten Achse an. Symmetrie-Kopien klingen immer wie das Original, mit <b>gleiche Töne</b> auch die Spiegelbilder.</p>

function grow(axiom, rules, gens) {
  const map = new Map();
  for (const [k, v] of rules) if (k && !map.has(k)) map.set(k, v);
  const out = [{ s: axiom, cut: false }];
  let s = axiom;
  for (let g = 1; g <= gens; g++) {
    let n = '';

    const cut = n.length > MAX_LEN;
    if (n.length >= MAX_LEN) n = n.slice(0, MAX_LEN);
    out.push({ s: n, cut });
    s = n;
  }

}

// Turtle in Schritt-Einheiten, y nach oben, Startrichtung rot0 (Grad)
function trace(s, angle, rot0 = 90) {
  let x = 0, y = 0, rot = rot0;
  const st = [], ops = [];
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (c === 'F' || c === 'G' || c === 'f') {
      const nx = x + Math.cos(rot * DEG), ny = y + Math.sin(rot * DEG);
      ops.push({ c, x0: x, y0: y, x1: nx, y1: ny, i });
      x = nx; y = ny;
    } else if (c === '+') rot += angle;
    else if (c === '-') rot -= angle;
    else if (c === '|') rot += 180;
    else if (c === '[') st.push([x, y, rot]);
    else if (c === ']') { if (st.length) [x, y, rot] = st.pop(); }
    else if (c === '!') { const d = s.slice(i + 1, i + 4); if (/^\d{3}$/.test(d)) rot += parseInt(d, 10); }
  }
  return ops;
}

function pitchStep(note, ch, angle, ns) {
  const th = angle * DEG;
  if (ch === '+') { const n = note + Math.ceil(ns * th - 1e-9); return n <= TOP ? n : 1 + (n - TOP); }
  if (ch === '-') { const n = note + Math.ceil(-ns * th - 1e-9); return n > 1 ? n : TOP - n; }
  return note;
}

function melody(s, angle, ns) {
  let note = null;

  for (let i = 0; i < s.length; i++) {
    if (note === null) note = TOP / 2;
    const c = s[i];
    if (c === 'F') ev.push({ i, note });
    else if (c === 'G') ev.push({ i, rest: true });
    else if (c === '+' || c === '-') note = pitchStep(note, c, angle, ns);
    else if (c === ']') note = null;
    else if (c === '!') {
      const d = s.slice(i + 1, i + 4);
      if (/^\d{3}$/.test(d)) { let n = note + Math.ceil(ns * parseInt(d, 10) * DEG); if (n > TOP) n = 1 + (n - TOP); note = n; }
    }
  }
  return ev;
}

}

const pitchTableCache = new Map();
function pitchTable(angle, ns) {
  const ck = angle + '|' + ns;
  if (pitchTableCache.has(ck)) return pitchTableCache.get(ck);
  const m = Math.round(180 / angle);
  const toks = ['+-', '|' + '-'.repeat(m), '|' + '+'.repeat(m)];
  const apply = (n, t) => { for (const c of t) n = pitchStep(n, c, angle, ns); return n; };
  const best = new Map([[12, '']]);
  let frontier = [12];
  while (frontier.length) {
    const nf = [];
    for (const n of frontier) for (const t of toks) {
      const v = apply(n, t);
      if (v < 1 || v > TOP) continue;
      const str = best.get(n) + t;
      if (!best.has(v) || best.get(v).length > str.length) { best.set(v, str); nf.push(v); }
    }
    frontier = nf;
  }
  pitchTableCache.set(ck, best);

}

function parseFlora(text) {
  const tables = {};
  let cur = null, id = null;
  const val = v => {
    v = v.trim();
    let m;
    if ((m = v.match(/^\{(\d+)\}$/))) return { ref: +m[1] };
    if ((m = v.match(/^"((?:[^"\\]|\\.)*)"$/))) return m[1].replace(/\\(.)/g, (_, c) => c === 'n' ? '\n' : c);
    if (v === 'true') return true;
    if (v === 'false') return false;
    if (v !== '' && !isNaN(+v)) return +v;
    return v;
  };
  let editor = null;
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    let m;
    if (line.startsWith('-- flora-editor ')) { try { editor = JSON.parse(line.slice(16)); } catch (e) { editor = null; } continue; }
    if ((m = line.match(/^-- Table: \{(\d+)\}/))) { id = +m[1]; continue; }
    if (line === '{' && id !== null) { cur = { arr: [], obj: {} }; tables[id] = cur; continue; }
    if (/^\},?$/.test(line)) { cur = null; continue; }
    if (!cur || !line) continue;
    const body = line.replace(/,$/, '');
    if ((m = body.match(/^\["((?:[^"\\]|\\.)*)"\]=(.*)$/))) cur.obj[m[1]] = val(m[2]);
    else if ((m = body.match(/^\[(\d+)\]=(.*)$/))) cur.arr[+m[1] - 1] = val(m[2]);
    else cur.arr.push(val(body));
  }

    if (!t) return null;
    const conv = v => (v && typeof v === 'object' && 'ref' in v) ? (seen.has(v.ref) ? null : resolve(tables[v.ref], new Set([...seen, v.ref]))) : v;
    if (t.arr.length && !Object.keys(t.obj).length) return t.arr.map(conv);
    const o = {};
    for (const k in t.obj) o[k] = conv(t.obj[k]);
    t.arr.forEach((v, i) => { o[i + 1] = conv(v); });
    return o;
  };
  const root = resolve(tables[1], new Set([1]));
  if (!root || root.axiom === undefined) throw new Error(t('err.noplant'));

    length: root.length !== undefined ? +root.length : 4, maxGen: root.max_generations !== undefined ? +root.max_generations : 1,

    y: root.start_from && root.start_from.y !== undefined ? +root.start_from.y : 58, rules, editor,
  };
}

  const node = (x, y) => { const k = pkey(x, y); if (!nodes.has(k)) nodes.set(k, { k, x, y, edges: [] }); return nodes.get(k); };
  const O = node(0, 0);
  const edges = D.segs.map(s => { const u = node(s.ax, s.ay), v = node(s.bx, s.by); const e = { s, u, v }; u.edges.push(e); v.edges.push(e); return e; });
  const less = (a, b) => a[0] < b[0] || (a[0] === b[0] && a[1] < b[1]);
  // Baum: Wege mit moeglichst frueher Generation bevorzugen
  const dist = new Map([[O.k, [0, 0]]]), parent = new Map(), done = new Set();
  for (;;) {
    let best = null;
    for (const [k, d] of dist) if (!done.has(k) && (!best || less(d, dist.get(best)))) best = k;
    if (!best) break;
    done.add(best);
    const n = nodes.get(best), d = dist.get(best);
    for (const e of n.edges) {
      const o = e.u === n ? e.v : e.u;
      const nd = [Math.max(d[0], e.s.g), d[1] + 1];
      if (!done.has(o.k) && (!dist.has(o.k) || less(nd, dist.get(o.k)))) { dist.set(o.k, nd); parent.set(o.k, e); }
    }
  }
  const kids = new Map(), effGen = new Map();
  const addKid = (n, item) => { if (!kids.has(n.k)) kids.set(n.k, []); kids.get(n.k).push(item); };
  let unreached = 0;
  for (const e of edges) {
    if (!dist.has(e.u.k) || !dist.has(e.v.k)) { unreached++; continue; }
    if (parent.get(e.v.k) === e) addKid(e.u, { e, to: e.v, tree: true });
    else if (parent.get(e.u.k) === e) addKid(e.v, { e, to: e.u, tree: true });
    else if (less(dist.get(e.v.k), dist.get(e.u.k))) addKid(e.v, { e, to: e.u, tree: false });
    else addKid(e.u, { e, to: e.v, tree: false });
  }
  if (unreached) warnings.push(t('w.unreached', { n: unreached }));

  const rules = new Map(), memo = new Map();
  let li = 0, maxG = 0;
  const letterFor = body => {
    if (memo.has(body)) return memo.get(body);
    if (li >= LETTERS.length) throw new Error(t('err.letters'));
    const L = LETTERS[li++];
    memo.set(body, L); rules.set(L, body);
    return L;
  };
  const defer = (body, d) => { let s = body; for (let k = 0; k < d; k++) s = letterFor(s); return s; };
  const turn = (h, d) => {
    let delta = ((d - h) % 360 + 540) % 360 - 180;
    if (Math.abs(delta + 180) < 1e-6) delta = 180;
    if (Math.abs(Math.abs(delta) - 180) < 1e-6) return '|';
    const k = Math.round(delta / angle);
    const plain = (k > 0 ? '+' : '-').repeat(Math.abs(k));
    const d2 = delta > 0 ? delta - 180 : delta + 180, k2 = Math.round(d2 / angle);
    const alt = '|' + (k2 > 0 ? '+' : '-').repeat(Math.abs(k2));
    return alt.length < plain.length ? alt : plain;
  };
  const table = pitchTable(angle, ns);
  const prefix = (s, off) => {
    const want = s.p ?? (tmpPitch ? tmpPitch.get(s.id) : undefined);
    if (s.t !== 'F' || want === null || want === undefined) return '';
    const t = Math.max(1, Math.min(TOP, want + off));
    if (table.has(t)) return '[]' + table.get(t);
    let bt = 12; for (const k of table.keys()) if (Math.abs(k - t) < Math.abs(bt - t)) bt = k;
    return '[]' + table.get(bt);
  };
  // frueheste Generation in einem Ast (Spruenge zaehlen nur, wenn nichts dahinter kommt)
  const minMemo = new Map();
  const minGen = c => {
    if (minMemo.has(c)) return minMemo.get(c);
    let m = c.e.s.t === 'f' ? Infinity : c.e.s.g;
    if (c.tree) for (const k of (kids.get(c.to.k) || [])) m = Math.min(m, minGen(k));
    if (m === Infinity) m = c.e.s.g;
    minMemo.set(c, m);
    return m;
  };
  const emit = (n, h, p, off) => {
    const list = (kids.get(n.k) || []).map(c => {
      const dir = Math.atan2(c.to.y - n.y, c.to.x - n.x) / DEG;
      const m = Math.max(p, minGen(c)), s = c.e.s;
      const g = s.t === 'f' ? m : Math.max(m, s.g);
      maxG = Math.max(maxG, g);
      effGen.set(s.id, g);
      // Linie waechst spaeter als der Ast dahinter: erst unsichtbar ueberspringen, spaeter zeichnen
      const own = g > m ? '[' + defer(prefix(s, off) + s.t, g - m) + ']f' : prefix(s, off) + s.t;
      const body = turn(h, dir) + own + (c.tree ? emit(c.to, dir, m, off) : '');
      return defer(body, m - p);
    });
    list.sort((a, b) => a.length - b.length);
    return list.map((b, i) => i < list.length - 1 ? '[' + b + ']' : b).join('');
  };
  const n = D.sym || 1, step = 360 / n;
  const offs = String(D.armOffsets || '').split(/[,;\s]+/).filter(x => x !== '').map(Number);
  let axiom;
  if (n === 1) axiom = emit(O, 90, 0, offs[0] || 0);
  else {
    const arms = [];
    for (let i = 0; i < n; i++) arms.push(emit(O, 90, 0, offs[i] || 0));
    // Die Drehung zwischen den Armen verschiebt in Flora die Tonhoehe. "[]" stellt sie danach wieder auf
    // Stufe 12 (wie am Anfang des ersten Arms), damit jede Kopie genau wie der gezeichnete Arm klingt.
    let sep = turn(0, step);
    if (/[+-]/.test(sep)) sep += '[]';
    axiom = arms.every(a => a === '') ? '' : arms.map((a, i) => i < n - 1 ? '[' + a + ']' + sep : a).join('');
  }
  return { axiom, rules: [...rules.entries()], maxGen: Math.max(1, maxG), warnings, effGen };
}

function copyIndexOf(D) {
  const m = new Map();
  for (const c of segCopies(D)) m.set(segKeyXY(c.ax, c.ay, c.bx, c.by), c);
  return m;
}
// Tonhoehe jeder Ton-Linie (Grundarm) in der letzten Generation eines Compiler-Ergebnisses
function pitchBySeg(cc, D, angle, ns) {
  const gens = grow(cc.axiom, cc.rules, cc.maxGen), s = gens[gens.length - 1].s;
  const noteAt = new Map(melody(s, angle, ns).filter(e => !e.rest).map(e => [e.i, e.note]));
  const idx = copyIndexOf(D), res = new Map();
  for (const op of trace(s, angle, 90)) {
    if (op.c !== 'F') continue;
    const c = idx.get(segKeyXY(op.x0, op.y0, op.x1, op.y1));
    if (c && c.copy === 0 && !res.has(c.seg.id)) res.set(c.seg.id, noteAt.get(op.i));
  }
  return res;
}
/* Wie compile, aber gespiegelte Ton-Linien (an der senkrechten Achse) spielen denselben Ton wie ihr Original.
   Flora dreht fuer das Spiegelbild in die Gegenrichtung und landet so auf einer anderen Stufe; hier bekommt
   die Linie dann eine feste Tonhoehe. Hat nur eine Seite eine feste Tonhoehe, folgt ihr die andere. */
function compileDrawing(D, angle, ns) {
  let cc = compile(D, angle, ns);
  if (D.mirrorPitch === false) return cc;
  const idx = copyIndexOf(D), pairs = [];
  for (const s of D.segs) {
    if (s.t !== 'F') continue;
    const c = idx.get(segKeyXY(-s.ax, s.ay, -s.bx, s.by));
    if (c && c.seg.id !== s.id && c.seg.t === 'F' && s.id < c.seg.id) pairs.push([s, c.seg]);
  }
  if (!pairs.length) return cc;
  const base = cc, P0 = pitchBySeg(base, D, angle, ns), table = pitchTable(angle, ns);
  const isFixed = s => s.p !== null && s.p !== undefined;
  const cost = (s, w) => (isFixed(s) || P0.get(s.id) === w) ? 0 : (table.has(w) ? 2 + table.get(w).length : 99);
  // 'orig': Spiegelbild uebernimmt den Ton des Originals; 'cheap': gemeinsamer Ton mit den wenigsten Zusatzzeichen
  const targetOf = (a, b, mode) => {
    if (isFixed(a)) return a.p;
    if (isFixed(b)) return b.p;
    const pa = P0.get(a.id), pb = P0.get(b.id);
    if (mode === 'orig' || pa === undefined) return pa;
    let best = pa, bc = Infinity;
    for (const w of [pa, pb, 12, 13, 11]) { if (w === undefined) continue; const c = cost(a, w) + cost(b, w); if (c < bc) { bc = c; best = w; } }
    return best;
  };
  const tooLong = r => grow(r.axiom, r.rules, r.maxGen).some(g => g.cut);
  const run = mode => {
    const tmp = new Map();
    let r = base;
    for (let it = 0; it < 6; it++) {
      const P = it === 0 ? P0 : pitchBySeg(r, D, angle, ns);
      let changed = false;
      for (const [a, b] of pairs) {
        const want = targetOf(a, b, mode);
        if (want === undefined) continue;
        for (const s of [a, b]) {
          if (isFixed(s)) continue;
          if (P.get(s.id) !== want && tmp.get(s.id) !== want) { tmp.set(s.id, want); changed = true; }
        }
      }
      if (!changed) break;
      r = compile(D, angle, ns, tmp);
    }
    return r;
  };
  const orig = run('orig');
  if (!tooLong(orig)) return orig;
  const cheap = run('cheap');
  if (!tooLong(cheap)) { cheap.warnings.push(t('w.mirrorCheap', { max: MAX_LEN })); return cheap; }
  base.warnings.push(t('w.mirrorOff', { max: MAX_LEN }));
  return base;
}

// Code -> Zeichnung: die Linien der letzten Generation, jede mit der Generation, ab der sie zu sehen ist.
// Linien, die beim Wachsen wieder verschwinden, kann eine Zeichnung nicht darstellen; sie fallen weg.
function drawingFromCode(c) {
  const gens = grow(c.axiom, c.rules, Math.max(0, c.maxGen));
  const rank = { f: 0, G: 1, F: 2 }, finalSeg = new Map();
  for (const op of trace(gens[gens.length - 1].s, c.angle, 90)) {
    const k = segKeyXY(op.x0, op.y0, op.x1, op.y1);
    if (!finalSeg.has(k)) finalSeg.set(k, { ax: op.x0, ay: op.y0, bx: op.x1, by: op.y1, t: op.c });
    else if (rank[op.c] > rank[finalSeg.get(k).t]) finalSeg.get(k).t = op.c;
  }
  // ab welcher Generation ist die Linie ohne Unterbrechung bis zum Ende sichtbar?
  const present = gens.map(gg => {
    const set = new Set();
    for (const op of trace(gg.s, c.angle, 90)) if (op.c !== 'f') set.add(segKeyXY(op.x0, op.y0, op.x1, op.y1));
    return set;
  });
  let id = 1, vanished = 0;
  for (let g = 0; g < present.length - 1; g++) for (const k of present[g]) if (!finalSeg.has(k)) vanished++;
  const segs = [...finalSeg.entries()].map(([k, s]) => {
    let g = present.length - 1;
    if (s.t !== 'f') while (g > 0 && present[g - 1].has(k)) g--;
    else g = 0;
    return { id: id++, ax: s.ax, ay: s.ay, bx: s.bx, by: s.by, g, t: s.t, p: null };
  });
  segs.vanished = vanished;
  return segs;
}

    manual: false,

}
let S = freshState();
const UI = { tool: 'draw', type: 'F', curGen: 0, viewGen: null, sel: null, grid: true, pitches: true, plant2: true,
  scale: 5, root: 45, ns: 3, ms: 250, loop: false };
let undoStack = [], redoStack = [];
const snapshot = () => JSON.stringify(S);
function pushUndo() { undoStack.push(snapshot()); if (undoStack.length > 200) undoStack.shift(); redoStack = []; }
function undo() { if (!undoStack.length) return; redoStack.push(snapshot()); S = JSON.parse(undoStack.pop()); UI.sel = null; syncFromState(); }
function redo() { if (!redoStack.length) return; undoStack.push(snapshot()); S = JSON.parse(redoStack.pop()); UI.sel = null; syncFromState(); }
let saveTimer = 0;
function persist() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ S, ui: { scale: UI.scale, root: UI.root, ns: UI.ns, ms: UI.ms, lang: LANG } })); } catch (e) { /* kein Speicher verfuegbar */ }
  }, 300);
}
function restore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (d && d.S && d.S.code && d.S.draw) { S = d.S; const { lang, ...rest } = d.ui || {}; Object.assign(UI, rest); return true; }
  } catch (e) { /* ignorieren */ }
  return false;
}

   ===================================================================== */
let compiled = null;   // letztes Compiler-Ergebnis
let derived = null;    // Generationen, Spuren, Tonfolgen
function recompileFromDrawing() {
  try {
    compiled = compileDrawing(S.draw, S.code.angle, UI.ns);
    S.code.axiom = compiled.axiom;
    S.code.rules = compiled.rules;
    S.code.maxGen = compiled.maxGen;
    S.code.startGen = compiled.maxGen;
    S.manual = false;
  } catch (e) {
    compiled = { warnings: [e.message], effGen: new Map(), error: true };
  }
}
function derive() {
  const c = S.code;
  const gens = grow(c.axiom, c.rules, Math.max(0, c.maxGen | 0));
  const per = gens.map(gg => {
    const ops = trace(gg.s, c.angle, c.rot);
    const ev = melody(gg.s, c.angle, UI.ns);
    return { s: gg.s, cut: gg.cut, ops, ev };
  });
  derived = { gens: per };
}
function viewGen() {
  const max = derived ? derived.gens.length - 1 : 0;
  return UI.viewGen === null ? max : Math.min(UI.viewGen, max);
}
// Linien-Schluessel (alle Symmetrie-Kopien) -> Segment
function copyIndex() {
  const m = new Map();
  for (const c of segCopies(S.draw)) m.set(segKeyXY(c.ax, c.ay, c.bx, c.by), c);
  return m;
}

function renderStatus() {
  const el = $('#status'), parts = [];
  const last = derived.gens[derived.gens.length - 1];
  if (!S.manual) parts.push(`<span class="ok">${t('st.auto')}</span>`);
  else if (S.manualReason === 'file') parts.push(`<span class="warn">${t('st.file')}</span>`);

  else parts.push(`<span class="warn">${t('st.edit')}</span>`);
  if (compiled && compiled.warnings) for (const w of compiled.warnings) parts.push(`<span class="warn">⚠ ${w}</span>`);
  if (UI.notice) parts.push(`<span class="small">${t(UI.notice)}</span>`);
  if (derived.gens.some(g => g.cut)) parts.push(`<span class="err">${t('st.cut', { max: MAX_LEN })}</span>`);
  if (derived.gens.some(g => g.ev.some(e => !e.rest && (e.note < 1 || e.note > TOP))))
    parts.push(`<span class="warn">${t('st.range')}</span>`);
  const allCode = S.code.axiom + S.code.rules.map(r => r[1]).join('');
  if (/!(?!\d{3})/.test(allCode)) parts.push(`<span class="warn">${t('st.bang')}</span>`);

  parts.push(`<span class="small">${t('st.last', { len: last.s.length, max: MAX_LEN, n: last.ev.filter(e => !e.rest).length })}</span>`);
  el.innerHTML = parts.join('<br>');
}
function renderGenTable() {

  S.draw = { sym: 1, mirror: false, mirrorPitch: false, segs: [...segs], armOffsets: '', nextId: segs.length + 1 };
  UI.notice = segs.vanished ? 'notice.vanished' : '';
  fillSym();
  $('#mirrorChk').checked = false;
  $('#mirrorPitchChk').checked = false;
  UI.sel = null;
}
$('#btnFit').addEventListener('click', () => {
  const ops = derived.gens[derived.gens.length - 1].ops.filter(o => o.c !== 'f');
  if (!ops.length) return;
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const o of ops) for (const [x, y] of [[o.x0, o.y0], [o.x1, o.y1]]) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  const w = x1 - x0 || 1, h = y1 - y0 || 1;
  pushUndo();
  S.code.length = Math.max(1, Math.min(8, Math.floor(Math.min(54 / w, 44 / h) * 2) / 2));
  S.code.x = Math.round((64 - (x0 + x1) / 2 * S.code.length) * 2) / 2;
  S.code.y = Math.round((37 + (y0 + y1) / 2 * S.code.length) * 2) / 2;
  syncFromState();
});

// Klang-Einstellungen
$('#scaleSel').addEventListener('change', e => { UI.scale = +e.target.value; renderMelody(); persist(); });
$('#rootNote').addEventListener('change', e => { UI.root = parseInt(e.target.value, 10) || 45; renderMelody(); persist(); });
$('#noteScalar').addEventListener('change', e => {
  UI.ns = Math.max(0, parseFloat(e.target.value) || 0);
  if (!S.manual) { recompileFromDrawing(); refreshCodeFields(); }
  refresh();
});
$('#noteMs').addEventListener('change', e => { UI.ms = Math.max(40, parseInt(e.target.value, 10) || 250); persist(); });
$('#loopChk').addEventListener('change', e => { UI.loop = e.target.checked; });

/* ---------- Klang ---------- */
let actx = null, timers = [], voices = [];
function tone(midi, t, dur) {
  const o = actx.createOscillator(), g = actx.createGain(), f = actx.createBiquadFilter();
  o.type = 'triangle'; o.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
  f.type = 'lowpass'; f.frequency.value = 2400;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.22, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.001, t + Math.max(0.08, dur * 0.95));
  o.connect(f); f.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.05);
  voices.push(o);
}
function stopSound() {
  timers.forEach(clearTimeout); timers = [];
  voices.forEach(v => { try { v.stop(); } catch (e) { /* schon beendet */ } }); voices = [];
  playIdx = -1; $('#btnPlay').classList.remove('on');
  highlightMelody(-1); drawEditor(); drawPreview();
}
function highlightMelody(i) { $$('#melody span').forEach(sp => sp.classList.toggle('cur', +sp.dataset.i === i)); }
function play() {
  stopSound();
  if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) { info(t('info.noaudio')); return; } actx = new AC(); }
  if (actx.state === 'suspended') actx.resume();
  const ev = derived.gens[viewGen()].ev;
  if (!ev.length) return;
  const notes = scaleNotes(UI.root, UI.scale), dur = UI.ms / 1000;
  const t0 = actx.currentTime + 0.06;
  $('#btnPlay').classList.add('on');
  ev.forEach((e, k) => {
    const t = t0 + k * dur;
    if (!e.rest) { const pi = playableIndex(e.note); if (pi) tone(notes[pi - 1], t, dur); }
    timers.push(setTimeout(() => { playIdx = e.i; highlightMelody(e.i); drawEditor(); drawPreview(); }, (t - actx.currentTime) * 1000));
  });
  timers.push(setTimeout(() => { if (UI.loop) play(); else stopSound(); }, (t0 + ev.length * dur - actx.currentTime) * 1000 + 30));
}
$('#btnPlay').addEventListener('click', play);
$('#btnStop').addEventListener('click', stopSound);

/* ---------- Datei, Export, Beispiele ---------- */
function loadPlant(text, name) {
  const p = parseFlora(text);
  pushUndo();
  S.name = name || 'pflanze';
  S.code = { angle: p.angle, length: p.length, rot: p.rot, x: p.x, y: p.y, maxGen: Math.max(1, p.maxGen), startGen: p.startGen, axiom: p.axiom, rules: p.rules };
  S.manual = true; S.manualReason = 'file'; UI.notice = '';
  if (p.editor && Array.isArray(p.editor.segs)) {
    // mit dem Editor gespeichert: Zeichnung exakt wiederherstellen und pruefen, ob der Code noch dazu passt
    S.draw = drawingFromMeta(p.editor);
    if (p.editor.ns !== undefined) UI.ns = +p.editor.ns;
    try {
      const cc = compileDrawing(S.draw, S.code.angle, UI.ns);
      const same = cc.axiom === p.axiom && JSON.stringify(cc.rules) === JSON.stringify(p.rules) && cc.maxGen === Math.max(1, p.maxGen);
      if (same) { S.manual = false; S.manualReason = ''; }
      else S.manualReason = 'mismatch';
    } catch (e) { S.manualReason = 'mismatch'; }
  } else if ([30, 45, 60, 90].includes(+p.angle) && Math.abs(p.rot - 90) < 1e-9) {
    buildDrawingFromCode();
    // aeltere Datei ohne Zeichnungsdaten: verknuepfen, wenn der Editor genau diesen Code erzeugen wuerde
    try {
      const cc = compileDrawing(S.draw, S.code.angle, UI.ns);
      if (cc.axiom === p.axiom && JSON.stringify(cc.rules) === JSON.stringify(p.rules) && cc.maxGen === Math.max(1, p.maxGen)) { S.manual = false; S.manualReason = ''; }
    } catch (e) { /* bleibt unverknuepft */ }
  } else S.draw = { sym: 1, mirror: false, segs: [], armOffsets: '', nextId: 1 };
  UI.viewGen = null; UI.sel = null;
  syncFromState();
}
function download(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function showText(title, text) {
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = '';
  const ta = document.createElement('textarea'); ta.value = text; ta.readOnly = true; $('#modalBody').appendChild(ta);
  $('#modalCopy').style.display = '';
  $('#modal').classList.add('show'); ta.select();
}
function showHelp() {
  $('#modalTitle').textContent = t('modal.help');
  $('#modalBody').innerHTML = `<div style="max-height:60vh;overflow:auto">${t('help', { max: MAX_LEN })}</div>`;
  $('#modalCopy').style.display = 'none';
  $('#modal').classList.add('show');
}
$('#modalClose').addEventListener('click', () => $('#modal').classList.remove('show'));
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') $('#modal').classList.remove('show'); });
$('#modalCopy').addEventListener('click', async () => {
  const ta = $('#modalBody textarea'); if (!ta) return;
  try { await navigator.clipboard.writeText(ta.value); $('#modalCopy').textContent = t('btn.copied'); }
  catch (e) { ta.select(); document.execCommand('copy'); $('#modalCopy').textContent = t('btn.copied'); }
  setTimeout(() => { $('#modalCopy').textContent = t('btn.copy'); }, 1500);
});
// Zeichnung nur mitspeichern, wenn der Code aus ihr erzeugt ist (sonst passt sie nicht zum Code)
const saveFile = () => download(S.name + '.flora', toFlora(S.code, S.manual ? null : drawingMeta(S.draw, UI.ns)));
$('#btnSave').addEventListener('click', saveFile);
$('#btnSave2').addEventListener('click', saveFile);
$('#btnMaiden').addEventListener('click', () => showText(t('modal.maiden'), toMaiden(S.code, S.name)));
$('#btnCatalog').addEventListener('click', () => showText(t('modal.catalog'), toCatalog(S.code, S.name)));
$('#btnOpen').addEventListener('click', () => $('#fileInput').click());
$('#fileInput').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { loadPlant(await f.text(), f.name.replace(/\.[^.]*$/, '')); } catch (err) { info(t('info.readerr', { msg: err.message })); }
  e.target.value = '';
});
$('#exampleSel').addEventListener('change', e => {
  const n = e.target.value; e.target.value = '';
  if (n && EXAMPLES[n]) loadPlant(EXAMPLES[n], n);
});
$('#btnNew').addEventListener('click', async () => {
  if ((S.draw.segs.length || S.code.axiom) && !await ask(t('ask.new'), t('ok.new'))) return;
  stopSound(); pushUndo(); S = freshState(); UI.viewGen = null; UI.sel = null; UI.notice = ''; syncFromState();
});
$('#btnUndo').addEventListener('click', undo);
$('#btnRedo').addEventListener('click', redo);
$('#btnHelp').addEventListener('click', showHelp);
window.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if ($('#dlg').classList.contains('show')) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (e.key === 'Escape') { drag = null; $('#modal').classList.remove('show'); drawEditor(); return; }
  if ((e.key === 'Delete' || e.key === 'Backspace') && selectedSeg()) { const s = selectedSeg(); changeDrawing(() => { S.draw.segs = S.draw.segs.filter(x => x.id !== s.id); UI.sel = null; }); return; }
  const k = e.key.toLowerCase();
  if (k === 'd') setTool('draw'); else if (k === 's') setTool('select'); else if (k === 'p') setTool('paint'); else if (k === 'e') setTool('erase');
  else if (k === '1') setType('F'); else if (k === '2') setType('G'); else if (k === '3') setType('f');
  else if (k === ' ') { e.preventDefault(); playIdx >= 0 ? stopSound() : play(); }
});
window.addEventListener('resize', resizeEditor);

/* ---------- Sprache umschalten ---------- */
function applyI18n() {
  document.documentElement.lang = LANG;
  document.title = t('app.title');
  $$('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $$('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });

  $('#langSel').value = LANG;
  fillScaleNames();
}
$('#langSel').addEventListener('change', e => {
  LANG = LANGS.includes(e.target.value) ? e.target.value : 'en';
  // unveraenderten Standardnamen mit uebersetzen
  if (LANGS.some(l => I18N[l]['default.name'] === S.name)) S.name = t('default.name');
  applyI18n();
  if ($('#modal').classList.contains('show') && $('#modalCopy').style.display === 'none') showHelp();
  syncFromState();
});

/* ---------- Selbsttest (Konsole: floraSelfTest()) ---------- */
function geomSet(code, gen) {
  const gens = grow(code.axiom, code.rules, code.maxGen);
  const set = new Set();
  for (const op of trace(gens[Math.min(gen, gens.length - 1)].s, code.angle, 90)) if (op.c !== 'f') set.add(segKeyXY(op.x0, op.y0, op.x1, op.y1));
  return set;
}
const sameSet = (a, b) => a.size === b.size && [...a].every(x => b.has(x));
window.floraSelfTest = function () {
  const res = [];
  for (const [name, text] of Object.entries(EXAMPLES)) {
    const p = parseFlora(text);
    const code = { angle: p.angle, axiom: p.axiom, rules: p.rules, maxGen: p.maxGen };
    const segs = drawingFromCode(code);
    const D = { sym: 1, mirror: false, segs, armOffsets: '' };
    const cc = compile(D, p.angle, 3);
    const code2 = { angle: p.angle, axiom: cc.axiom, rules: cc.rules, maxGen: cc.maxGen };
    const gensOk = [];
    for (let g = 0; g <= p.maxGen; g++) gensOk.push(sameSet(geomSet(code, g), geomSet(code2, g)));
    const len = grow(code2.axiom, code2.rules, code2.maxGen).map(x => x.s.length);
    res.push({ name, endform: gensOk[gensOk.length - 1], verschwindend: segs.vanished, generationen: gensOk.map(b => b ? 'j' : 'N').join(''), laengen: len.join('/'), maxGen: `${p.maxGen}/${cc.maxGen}` });
  }
  return res;
};
